# LiteLLM Proxy Configuration
# Maps OpenAI model names to Claude models
model_list:
  # GPT-4 series mapped to Claude Sonnet
  - model_name: gpt-4
    litellm_params:
      model: claude-3-5-sonnet-20241022
      api_key: ${ANTHROPIC_API_KEY}
      api_base: ${ANTHROPIC_BASE_URL}

  - model_name: gpt-4o
    litellm_params:
      model: claude-3-5-sonnet-20241022
      api_key: ${ANTHROPIC_API_KEY}
      api_base: ${ANTHROPIC_BASE_URL}

  - model_name: gpt-4-turbo
    litellm_params:
      model: claude-3-5-sonnet-20241022
      api_key: ${ANTHROPIC_API_KEY}
      api_base: ${ANTHROPIC_BASE_URL}

  # GPT-3.5 series mapped to Claude Haiku (faster and cheaper)
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: claude-3-haiku-20240307
      api_key: ${ANTHROPIC_API_KEY}
      api_base: ${ANTHROPIC_BASE_URL}

  - model_name: gpt-3.5-turbo-16k
    litellm_params:
      model: claude-3-haiku-20240307
      api_key: ${ANTHROPIC_API_KEY}
      api_base: ${ANTHROPIC_BASE_URL}

# General settings
general_settings:
  disable_auth: true
  enable_cors: true
  cors_origins: ["*"]
  set_verbose: ${DEBUG}
  disable_spend_logs: true

# LiteLLM settings
litellm_settings:
  set_verbose: ${DEBUG}
  request_timeout: 600
  num_retries: 3
  max_parallel_requests: 100