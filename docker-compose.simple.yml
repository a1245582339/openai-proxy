services:
  litellm-proxy:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: litellm-openai-proxy:latest
    container_name: litellm-openai-proxy
    restart: unless-stopped
    ports:
      - "${PORT:-8443}:${PORT:-8443}"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?请设置 ANTHROPIC_API_KEY 环境变量}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - PORT=${PORT:-8443}
      - DEBUG=${DEBUG:-false}
    volumes:
      - litellm_certs:/app/certs
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:${PORT:-8443}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  litellm_certs: