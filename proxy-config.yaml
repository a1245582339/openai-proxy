# LiteLLM Proxy Configuration
# Unified configuration file, supports both Docker container and Shell script startup methods
#
# Environment variables:
#   ANTHROPIC_API_KEY: Claude API Key (required)
#   ANTHROPIC_BASE_URL: Claude API address (optional, defaults to official address)
#   CLAUDE_MODEL: Claude model name (optional, defaults to claude-sonnet-4-5)
#                 Available options: claude-sonnet-4-5, claude-opus-4, claude-haiku-4, etc.
#   DEBUG: Debug mode switch (optional, true/false)

model_list:
  # GPT-4 series mapped to Claude model
  - model_name: gpt-4
    litellm_params:
      model: openai/${CLAUDE_MODEL}
      api_key: ${ANTHROPIC_API_KEY}
      api_base: ${ANTHROPIC_BASE_URL}

  - model_name: gpt-4o
    litellm_params:
      model: openai/${CLAUDE_MODEL}
      api_key: ${ANTHROPIC_API_KEY}
      api_base: ${ANTHROPIC_BASE_URL}

  - model_name: gpt-4-turbo
    litellm_params:
      model: openai/${CLAUDE_MODEL}
      api_key: ${ANTHROPIC_API_KEY}
      api_base: ${ANTHROPIC_BASE_URL}

  # GPT-5 mapping (reserved)
  - model_name: gpt-5
    litellm_params:
      model: openai/${CLAUDE_MODEL}
      api_key: ${ANTHROPIC_API_KEY}
      api_base: ${ANTHROPIC_BASE_URL}

  # GPT-3.5 series mapped to Claude model
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: openai/${CLAUDE_MODEL}
      api_key: ${ANTHROPIC_API_KEY}
      api_base: ${ANTHROPIC_BASE_URL}

# General settings
general_settings:
  # Completely disable authentication, simulate OpenAI API
  master_key: null
  disable_auth: true

  # CORS settings
  enable_cors: true
  cors_origins: ["*"]

  # Simulate OpenAI response format
  disable_spend_logs: true

  # Debug mode (controlled via environment variable)
  set_verbose: ${DEBUG}

# LiteLLM settings
litellm_settings:
  # Automatically drop unsupported parameters (resolves reasoning_effort and other parameter compatibility issues)
  drop_params: true

  # Log level
  set_verbose: ${DEBUG}

  # Timeout and retry settings
  request_timeout: 600
  num_retries: 3

  # Concurrency settings
  max_parallel_requests: 100

  # Disable background health check (avoid 401/403 errors and extra API calls)
  disable_health_check: true
