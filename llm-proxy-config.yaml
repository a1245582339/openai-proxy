# 服务器配置
general_settings:
  # 彻底禁用认证，模拟OpenAI API
  master_key: null
  disable_auth: true
  # 启用CORS
  enable_cors: true
  # 模拟OpenAI响应格式
  disable_spend_logs: true

# LiteLLM 设置
litellm_settings:
  # 自动删除不支持的参数
  drop_params: true
  # 设置日志级别
  set_verbose: true